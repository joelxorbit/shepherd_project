<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – Document Automation</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-login-body">

<div class="login-container">
  <div class="brand" style="text-align: center; margin-bottom: 20px;">
    <img src="/images/sjcbanner.png" alt="SJC Banner" style="max-height: 50px; width: auto;" onerror="this.style.display='none'"/>
  </div>
  <h2 class="login-title">Admin Login</h2>
  <form id="admin-login-form">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" class="form-input" required placeholder="Enter username" />
    </div>
    <div class="form-group" style="margin-top: 15px;">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" class="form-input" required placeholder="Enter password" />
    </div>
    <div id="login-error" class="login-error hidden">Invalid credentials.</div>
    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 25px; width: 100%;">Login</button>
  </form>
</div>

<script>
  document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('login-error');

    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('adminToken', data.token);
        window.location.href = '/admin.html';
      } else {
        errorEl.textContent = data.message;
        errorEl.classList.remove('hidden');
      }
    } catch (err) {
      errorEl.textContent = 'Server error. Please try again.';
      errorEl.classList.remove('hidden');
    }
  });
</script>

</body>
</html>
